<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Destinations | Global Destinations</title>
    <meta name="description" content="Browse and filter all available travel destinations by type, including beach, culture, and mountain adventures.">
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Linking to the dedicated final.css file -->
    <link rel="stylesheet" href="styles/final.css">
    <script src="scripts/main.js" defer></script> 
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header and Navigation (Identical to index.html) -->
    <header class="bg-indigo-700 text-white shadow-lg p-4 sticky top-0 z-10">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold tracking-tight flex items-center">
                <i data-lucide="globe" class="w-7 h-7 inline-block mr-2 text-amber-300"></i>
                Global Destinations
            </h1>
            <nav id="nav-links" class="hidden md:flex space-x-6 text-lg font-medium">
                <a href="index.html" class="hover:text-amber-100 transition duration-150">Home</a>
                <a href="products.html" class="text-amber-300 hover:text-amber-100 transition duration-150">Destinations</a>
                <a href="contact.html" class="hover:text-amber-100 transition duration-150">Contact & Reviews</a>
            </nav>
            <button id="menu-toggle" class="md:hidden p-2 rounded-lg hover:bg-indigo-600 transition duration-150" aria-label="Toggle navigation">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="container mx-auto p-4 md:p-8 flex-grow">
        
        <h2 class="text-4xl font-extrabold text-gray-800 mb-6 border-b pb-2">All Travel Destinations</h2>

        <!-- Filtering Section -->
        <section class="bg-white p-6 rounded-xl shadow-md mb-8 flex flex-col sm:flex-row items-center gap-4 border border-gray-100">
            <label for="filter-type" class="text-lg font-medium text-gray-700 whitespace-nowrap">Filter by Type:</label>
            <select id="filter-type" class="p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 shadow-sm bg-gray-50 w-full sm:w-auto">
                <option value="all">Show All</option>
                <option value="plage">Beach</option>
                <option value="culture">Culture</option>
                <option value="montagne">Mountain</option>
            </select>
            <button id="apply-filter" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition duration-300">
                Apply Filter
                <i data-lucide="filter" class="w-4 h-4 inline-block ml-1"></i>
            </button>
        </section>

        <!-- Dynamic Destination List Container -->
        <section>
            <div id="all-destinations-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                <!-- All destinations loaded by main.js -->
            </div>
        </section>

    </main>

    <!-- Footer Section (Common to all pages) -->
    <footer class="bg-gray-800 text-white p-4 mt-8">
        <div class="container mx-auto text-center text-sm">
            <p>
                &copy;<span id="copyright-year"></span> Global Destinations. All Rights Reserved. 
            </p>
        </div>
    </footer>
    
    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
