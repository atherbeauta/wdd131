<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Reviews | Global Destinations</title>
    <meta name="description" content="Get in touch with us or leave a review for a destination you visited.">
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Linking to the dedicated final.css file -->
    <link rel="stylesheet" href="styles/final.css">
    <script src="scripts/main.js" defer></script> 
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header and Navigation (Identical to index.html) -->
    <header class="bg-indigo-700 text-white shadow-lg p-4 sticky top-0 z-10">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold tracking-tight flex items-center">
                <i data-lucide="globe" class="w-7 h-7 inline-block mr-2 text-amber-300"></i>
                Global Destinations
            </h1>
            <nav id="nav-links" class="hidden md:flex space-x-6 text-lg font-medium">
                <a href="index.html" class="hover:text-amber-100 transition duration-150">Home</a>
                <a href="products.html" class="hover:text-amber-100 transition duration-150">Destinations</a>
                <a href="contact.html" class="text-amber-300 hover:text-amber-100 transition duration-150">Contact & Reviews</a>
            </nav>
            <button id="menu-toggle" class="md:hidden p-2 rounded-lg hover:bg-indigo-600 transition duration-150" aria-label="Toggle navigation">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="container mx-auto p-4 md:p-8 flex-grow">
        
        <h2 class="text-4xl font-extrabold text-gray-800 mb-8 border-b pb-2">Share Your Travel Experience</h2>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            
            <!-- Review Submission Form (Criterion 8, 10, 11) -->
            <section class="bg-white p-8 rounded-2xl shadow-xl border border-gray-200">
                <h3 class="text-2xl font-semibold mb-4 text-indigo-700 flex items-center">
                    <i data-lucide="message-square" class="w-6 h-6 mr-2"></i>
                    Submit a New Review
                </h3>
                
                <form id="review-form" class="space-y-4">
                    
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700">Your Name (Optional)</label>
                        <input type="text" id="name" name="name" placeholder="John Doe"
                                class="w-full p-2 border border-gray-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 shadow-sm">
                    </div>
                    
                    <div>
                        <label for="destination" class="block text-sm font-medium text-gray-700">Destination Visited (Required)</label>
                        <select id="destination" name="destination" required 
                                class="w-full p-2 border border-gray-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 shadow-sm bg-gray-50">
                            <option value="" disabled selected>-- Select a destination --</option>
                            <!-- Options filled dynamically by main.js -->
                        </select>
                    </div>

                    <div>
                        <label for="rating" class="block text-sm font-medium text-gray-700">Rating (1 to 5 Stars)</label>
                        <input type="number" id="rating" name="rating" min="1" max="5" required value="5"
                                class="w-full p-2 border border-gray-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 shadow-sm">
                    </div>

                    <div>
                        <label for="review-text" class="block text-sm font-medium text-gray-700">Your Review (Min 50 characters)</label>
                        <textarea id="review-text" name="review_text" rows="4" required placeholder="Describe your experience..."
                                  class="w-full p-2 border border-gray-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 shadow-sm"></textarea>
                    </div>
                    
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition duration-300">
                        <i data-lucide="send" class="w-5 h-5 inline-block mr-2"></i>
                        Submit Review
                    </button>
                    
                    <!-- Form message container (Updated by JS) -->
                    <div id="form-message" class="text-sm"></div>
                </form>
            </section>

            <!-- Customer Reviews Display (Criterion 15) -->
            <section class="bg-white p-8 rounded-2xl shadow-xl border border-gray-200">
                <h3 class="text-2xl font-semibold mb-4 text-indigo-700 flex items-center">
                    <i data-lucide="list-checks" class="w-6 h-6 mr-2"></i>
                    Customer Testimonials
                </h3>
                
                <p class="text-sm text-gray-600 mb-4">
                    We currently have <strong id="review-count" class="text-indigo-600 font-bold">0</strong> total reviews.
                </p>

                <!-- Review List Container (Loaded by main.js) -->
                <ul id="customer-reviews-list" class="space-y-4">
                    <!-- Reviews loaded by loadReviews() -->
                </ul>
            </section>
        </div>

    </main>

    <!-- Footer Section (Common to all pages) -->
    <footer class="bg-gray-800 text-white p-4 mt-8">
        <div class="container mx-auto text-center text-sm">
            <p>
                &copy;<span id="copyright-year"></span> Global Destinations. All Rights Reserved. 
            </p>
        </div>
    </footer>
    
    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
